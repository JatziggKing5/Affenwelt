<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein erstes Spiel</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
    #hilfe {
      position: fixed; top: 12px; left: 12px; padding: 8px 12px;
      background: rgba(0,0,0,0.5); color: #fff; border-radius: 8px; font-size: 14px;
      max-width: calc(100vw - 240px); /* Platz lassen für die Punkte oben rechts */
    }
    #punkte {
      position: fixed; top: 12px; right: 12px;
      padding: 8px 16px; background: rgba(0,0,0,0.6); color: #ffd700;
      border-radius: 10px; font-size: 22px; font-weight: bold; white-space: nowrap;
    }
    #kabine {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
      padding: 14px 16px; background: rgba(30, 10, 40, 0.85); color: #fff;
      border-radius: 14px; text-align: center; display: none;
    }
    #kabine.offen { display: block; }
    #kabine h2 { margin: 0 0 4px; font-size: 22px; }
    #kabine p { margin: 4px 0 10px; font-size: 14px; }
    #kabine p.klein { margin: 10px 0 0; font-size: 12px; opacity: 0.7; }
    #farben { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    #farben button {
      aspect-ratio: 1; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3);
      cursor: pointer; padding: 0; position: relative;
    }
    #farben button:hover { transform: scale(1.12); }
    #farben button.gewaehlt { border-color: #fff; box-shadow: 0 0 0 3px #ffd700; }
    #farben button span {
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: 10px; white-space: nowrap; opacity: 0; transition: opacity 0.2s;
    }
    #farben button:hover span { opacity: 1; }
    #fahrinfo {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      max-width: calc(100vw - 32px); box-sizing: border-box;
      padding: 10px 18px; background: rgba(0, 0, 0, 0.7); color: #fff;
      border-radius: 12px; text-align: center; display: none; pointer-events: none;
    }
    #fahrinfo.offen { display: block; }
    #fahrinfo b { font-size: 20px; }
    #fahrinfo small { display: block; margin-top: 4px; font-size: 12px; opacity: 0.8; }
    #meldung {
      position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 40px; font-weight: bold; text-align: center;
      text-shadow: 0 3px 8px rgba(0,0,0,0.6); pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
  </style>
  <!-- Import-Map: sagt dem Browser, wo er Three.js herunterladen soll -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
    } }
  </script>
</head>
<body>
  <div id="punkte"></div>
  <div id="meldung"></div>
  <div id="fahrinfo"></div>
  <div id="kabine">
    <h2>👕 Umkleidekabine</h2>
    <p>Klick auf eine Farbe für das Fell deines Affen:</p>
    <div id="farben"></div>
    <p class="klein">Zum Verlassen einfach rauslaufen.</p>
  </div>
  <div id="hilfe">W A S D: laufen · Pfeiltasten: Kamera drehen · Leertaste: springen (2× = Doppelsprung) · Obby: mit W nach hinten über den Rand der Wiese! · Garage mit Fahrzeugen: an der Kreuzung, E = einsteigen</div>

  <script type="module">
    import * as THREE from 'three/webgpu';

    // --- Szene, Kamera und Renderer: die "Bühne", das "Auge" und der "Maler" ---
    const szene = new THREE.Scene();
    szene.background = new THREE.Color(0x87ceeb); // hellblauer Himmel

    const kamera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);

    // WebGPU-Renderer: malt mit der modernen Grafik-Schnittstelle WebGPU
    const renderer = new THREE.WebGPURenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    await renderer.init(); // WebGPU starten (dauert einen Moment)

    // Anzeigen, ob wirklich WebGPU läuft
    const hilfe = document.getElementById('hilfe');
    hilfe.textContent += renderer.backend.isWebGPUBackend
      ? ' · WebGPU ✓'
      : ' · Achtung: kein WebGPU, nur WebGL';

    // --- Licht: eine weiche Grundhelligkeit plus eine "Sonne", die Schatten wirft ---
    szene.add(new THREE.HemisphereLight(0xffffff, 0x446644, 1.0));
    const sonne = new THREE.DirectionalLight(0xffffff, 2);
    sonne.position.set(10, 20, 10);
    sonne.castShadow = true;
    sonne.shadow.bias = -0.0005;      // verhindert Streifen-Muster auf den Blöcken
    sonne.shadow.normalBias = 0.02;
    sonne.shadow.mapSize.set(2048, 2048); // schärfere Schatten
    sonne.shadow.camera.left = -30; sonne.shadow.camera.right = 30;
    sonne.shadow.camera.top = 30;   sonne.shadow.camera.bottom = -30;
    szene.add(sonne);
    szene.add(sonne.target); // damit die Sonne dem Affen folgen kann

    // --- Grüner Boden: eine große flache Fläche ---
    // Die Wiese geht von links -60 bis rechts 60 und von hinten -25 (dort beginnt die Obby) bis vorne 95.
    const WIESE = { x1: -60, x2: 60, z1: -25, z2: 95 };
    const boden = new THREE.Mesh(
      new THREE.PlaneGeometry(WIESE.x2 - WIESE.x1, WIESE.z2 - WIESE.z1),
      new THREE.MeshStandardMaterial({ color: 0x4caf50 })
    );
    boden.rotation.x = -Math.PI / 2; // flach hinlegen
    boden.position.set((WIESE.x1 + WIESE.x2) / 2, 0, (WIESE.z1 + WIESE.z2) / 2);
    boden.receiveShadow = true;
    szene.add(boden);

    // Nebel in der Ferne: die große Welt verschwindet sanft im Himmel
    szene.fog = new THREE.Fog(0x87ceeb, 50, 170);

    // ================= STRASSEN =================
    // Jede Straße ist ein Rechteck: x1..x2 und z1..z2
    const STRASSEN = [
      { x1: -3, x2: 3, z1: 6, z2: WIESE.z2, richtung: 'z' },          // Hauptstraße: vom Start nach vorne
      { x1: WIESE.x1, x2: WIESE.x2, z1: 47, z2: 53, richtung: 'x' },  // Querstraße: von links nach rechts
    ];
    const asphalt = new THREE.MeshStandardMaterial({ color: 0x424242, roughness: 0.95 });
    const linie   = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
    const gelb    = new THREE.MeshStandardMaterial({ color: 0xfdd835, roughness: 0.6 });

    function flach(material, x, z, b, t, y) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(b, 0.02, t), material);
      m.position.set(x, y, z);
      m.receiveShadow = true;
      szene.add(m);
    }
    function aufKreuzung(x, z) { // liegt der Punkt auf beiden Straßen gleichzeitig?
      return STRASSEN.filter(s => x > s.x1 - 0.5 && x < s.x2 + 0.5 && z > s.z1 - 0.5 && z < s.z2 + 0.5).length > 1;
    }
    STRASSEN.forEach((s, i) => {
      const mx = (s.x1 + s.x2) / 2, mz = (s.z1 + s.z2) / 2;
      flach(asphalt, mx, mz, s.x2 - s.x1, s.z2 - s.z1, 0.01 + i * 0.002);
      // Gestrichelte gelbe Mittellinie (nicht auf der Kreuzung)
      if (s.richtung === 'z') {
        for (let z = s.z1 + 1.5; z < s.z2; z += 4) if (!aufKreuzung(mx, z)) flach(gelb, mx, z, 0.18, 2, 0.03);
        flach(linie, s.x1 + 0.3, mz, 0.12, s.z2 - s.z1, 0.025); // weiße Randlinien
        flach(linie, s.x2 - 0.3, mz, 0.12, s.z2 - s.z1, 0.025);
      } else {
        for (let x = s.x1 + 1.5; x < s.x2; x += 4) if (!aufKreuzung(x, mz)) flach(gelb, x, mz, 2, 0.18, 0.03);
        flach(linie, mx, s.z1 + 0.3, s.x2 - s.x1, 0.12, 0.025);
        flach(linie, mx, s.z2 - 0.3, s.x2 - s.x1, 0.12, 0.025);
      }
      // Zebrastreifen direkt vor dem Start
      if (i === 0) for (let x = s.x1 + 0.5; x < s.x2; x += 1) flach(linie, x, s.z1 + 1.2, 0.5, 1.8, 0.035);
    });
    // Ist ein Punkt auf (oder nah an) einer Straße?
    function nahAnStrasse(x, z, abstand) {
      return STRASSEN.some(s => x > s.x1 - abstand && x < s.x2 + abstand && z > s.z1 - abstand && z < s.z2 + abstand);
    }

    // --- Der Affe: unsere Spielfigur, gebaut aus Kugeln und Röhren ---
    // "affe" ist der unsichtbare Halter (1×1×1 groß, für Zusammenstöße),
    // "figur" ist der sichtbare Affe darin, der wackeln und hüpfen darf.
    const affe = new THREE.Group();
    affe.position.y = 0.5; // halbe Höhe, damit er AUF dem Boden steht
    szene.add(affe);
    const figur = new THREE.Group();
    affe.add(figur);

    const fell  = new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.9 }); // dunkelbraunes Fell
    const haut  = new THREE.MeshStandardMaterial({ color: 0xf2c79b, roughness: 0.8 }); // Gesicht, Hände, Füße
    const weiss = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const schwarz = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
    const rosa  = new THREE.MeshStandardMaterial({ color: 0xff7aa8, roughness: 0.6 });

    // Hilfsfunktion: eine Kugel bauen, verschieben und strecken
    function kugel(r, material, x, y, z, sx = 1, sy = 1, sz = 1, eltern = figur) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), material);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      m.castShadow = true;
      eltern.add(m);
      return m;
    }

    // Bauch und Körper
    kugel(0.3,  fell, 0, -0.08, 0, 1, 1.1, 0.9);
    kugel(0.21, haut, 0, -0.1, 0.14, 1, 1.1, 0.6);
    // Kopf (etwas zu groß – das macht ihn lustig)
    const kopf = new THREE.Group();
    kopf.position.set(0, 0.32, 0);
    figur.add(kopf);
    kugel(0.3,  fell, 0, 0, 0, 1, 0.95, 1, kopf);
    kugel(0.21, haut, 0, -0.05, 0.17, 1.15, 0.85, 0.65, kopf);  // Gesicht/Schnauze
    // Glupschaugen (ein Auge größer als das andere)
    kugel(0.1,  weiss,   -0.1, 0.09, 0.22, 1, 1, 0.8, kopf);
    kugel(0.08, weiss,    0.1, 0.08, 0.23, 1, 1, 0.8, kopf);
    kugel(0.045, schwarz, -0.09, 0.08, 0.3, 1, 1, 1, kopf);
    kugel(0.04,  schwarz,  0.11, 0.06, 0.3, 1, 1, 1, kopf);
    // Nasenlöcher
    kugel(0.018, schwarz, -0.03, -0.03, 0.3, 1, 1, 1, kopf);
    kugel(0.018, schwarz,  0.03, -0.03, 0.3, 1, 1, 1, kopf);
    // Breites Grinsen mit Zunge
    const mund = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.018, 8, 20, Math.PI), schwarz);
    mund.rotation.z = Math.PI; // Bogen nach unten = Lächeln
    mund.position.set(0, -0.08, 0.27);
    kopf.add(mund);
    kugel(0.035, rosa, 0.03, -0.15, 0.27, 1, 0.7, 0.6, kopf);
    // Abstehende Ohren
    kugel(0.1,  fell, -0.31, 0.03, 0, 1, 1, 0.5, kopf);
    kugel(0.1,  fell,  0.31, 0.03, 0, 1, 1, 0.5, kopf);
    kugel(0.06, haut, -0.33, 0.03, 0.03, 1, 1, 0.4, kopf);
    kugel(0.06, haut,  0.33, 0.03, 0.03, 1, 1, 0.4, kopf);
    // Ein kleines Haarbüschel oben drauf
    kugel(0.05, fell, 0, 0.3, 0.02, 0.6, 1.6, 0.6, kopf);

    // Arme: hängen an der Schulter, damit sie schwingen können
    function arm(seite) {
      const schulter = new THREE.Group();
      schulter.position.set(0.27 * seite, 0.08, 0);
      figur.add(schulter);
      const roehre = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.42, 10), fell);
      roehre.position.y = -0.2;
      roehre.castShadow = true;
      schulter.add(roehre);
      kugel(0.08, haut, 0, -0.43, 0, 1, 1, 1, schulter); // Hand
      schulter.rotation.z = 0.35 * seite; // Arme leicht abstehen lassen
      return schulter;
    }
    const armLinks = arm(-1), armRechts = arm(1);

    // Beine mit großen Füßen
    function bein(seite) {
      const huefte = new THREE.Group();
      huefte.position.set(0.12 * seite, -0.3, 0);
      figur.add(huefte);
      const roehre = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.15, 10), fell);
      roehre.position.y = -0.07;
      roehre.castShadow = true;
      huefte.add(roehre);
      kugel(0.08, haut, 0, -0.16, 0.05, 1, 0.55, 1.6, huefte); // Fuß
      return huefte;
    }
    const beinLinks = bein(-1), beinRechts = bein(1);

    // Ringelschwanz hinten
    const schwanzKurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, -0.25, -0.22),
      new THREE.Vector3(0, -0.2, -0.45),
      new THREE.Vector3(0, 0.05, -0.55),
      new THREE.Vector3(0.05, 0.22, -0.48),
      new THREE.Vector3(0.12, 0.2, -0.38),
      new THREE.Vector3(0.08, 0.1, -0.4),
    ]);
    const schwanz = new THREE.Mesh(new THREE.TubeGeometry(schwanzKurve, 30, 0.035, 8), fell);
    schwanz.castShadow = true;
    figur.add(schwanz);

    let blickRichtung = 0; // in welche Richtung der Affe schaut
    let laufZeit = 0;      // für das Wackeln beim Laufen

    // --- Alle Blöcke der Welt landen in dieser Liste ---
    // Jeder Block: x/z = Mitte, b = Breite, t = Tiefe, unten/oben = Höhe von Unterkante und Oberkante,
    // art = 'block' (normal), 'lava' (tödlich), 'checkpoint' (Speicherpunkt), 'ziel' (Ende der Obby)
    const bloecke = [];
    const FARBEN = { lava: 0xff3300, checkpoint: 0x2196f3, ziel: 0xffd700 };
    function neuerBlock(x, z, b, t, unten, oben, art = 'block', farbe = 0x9e9e9e) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(b, oben - unten, t),
        new THREE.MeshStandardMaterial({
          color: FARBEN[art] ?? farbe,
          emissive: art === 'lava' ? 0x991100 : 0x000000 // Lava leuchtet
        })
      );
      mesh.position.set(x, (unten + oben) / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      szene.add(mesh);
      const block = { x, z, b, t, unten, oben, art, mesh };
      bloecke.push(block);
      return block;
    }

    // --- Hindernisse auf der Wiese: [x, z, breite, höhe, tiefe, farbe] ---
    const hindernisListe = [
      [ 3, -3, 2, 1,   2, 0x8d6e63],
      [-4, -6, 1, 2,   4, 0x795548],
      [ 0, -9, 6, 0.8, 1, 0x9e9e9e],
      [ 6, -8, 2, 3,   2, 0x607d8b],
      [-7,  1, 3, 1.2, 3, 0x8d6e63],
      [ 5,  4, 1, 1.5, 1, 0x795548],
      [-2,-14, 4, 1,   4, 0x9e9e9e],
      [ 9,  0, 1, 2,   6, 0x607d8b],
    ];
    for (const [x, z, b, h, t, farbe] of hindernisListe) neuerBlock(x, z, b, t, 0, h, 'block', farbe);

    // ================= UMKLEIDEKABINE =================
    // Steht links hinten auf der Wiese. Die offene Seite zeigt zur Mitte (nach rechts).
    const KABINE = { x: -14, z: 10 };
    const KABINEN_FARBE = 0xf8bbd0; // rosa
    const kx = KABINE.x, kz = KABINE.z;
    neuerBlock(kx - 1.6, kz,       0.2, 3.4, 0, 3, 'block', KABINEN_FARBE); // Rückwand
    neuerBlock(kx,       kz - 1.6, 3.4, 0.2, 0, 3, 'block', KABINEN_FARBE); // Seitenwand
    neuerBlock(kx,       kz + 1.6, 3.4, 0.2, 0, 3, 'block', KABINEN_FARBE); // Seitenwand
    neuerBlock(kx,       kz,       3.6, 3.6, 3, 3.25, 'block', 0xec407a);   // Dach
    // Teppich am Boden (nur zum Anschauen)
    const teppich = new THREE.Mesh(
      new THREE.BoxGeometry(2.8, 0.02, 2.8),
      new THREE.MeshStandardMaterial({ color: 0x7e57c2 })
    );
    teppich.position.set(kx, 0.01, kz);
    teppich.receiveShadow = true;
    szene.add(teppich);
    // Vorhang an der Seite (rot, halb offen)
    const vorhang = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 2.7, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xc62828 })
    );
    vorhang.position.set(kx + 1.6, 1.6, kz - 1.15);
    vorhang.castShadow = true;
    szene.add(vorhang);
    // Schild "UMKLEIDE" über dem Eingang – auf eine Leinwand gemalt
    const leinwand = document.createElement('canvas');
    leinwand.width = 512; leinwand.height = 128;
    const pinsel = leinwand.getContext('2d');
    pinsel.fillStyle = '#ffffff'; pinsel.fillRect(0, 0, 512, 128);
    pinsel.fillStyle = '#ad1457'; pinsel.font = 'bold 80px sans-serif';
    pinsel.textAlign = 'center'; pinsel.textBaseline = 'middle';
    pinsel.fillText('UMKLEIDE', 256, 68);
    const schildTextur = new THREE.CanvasTexture(leinwand);
    schildTextur.colorSpace = THREE.SRGBColorSpace;
    const schild = new THREE.Mesh(
      new THREE.PlaneGeometry(3, 0.75),
      new THREE.MeshBasicMaterial({ map: schildTextur })
    );
    schild.position.set(kx + 1.82, 3.6, kz);
    schild.rotation.y = Math.PI / 2; // zur Wiese hin drehen
    szene.add(schild);

    // ================= WALD =================
    // Ein Zufallsgenerator mit festem Startwert: der Wald sieht bei jedem Start gleich aus
    let saat = 12345;
    function zufall() {
      saat = (saat + 0x6D2B79F5) | 0;
      let t = Math.imul(saat ^ (saat >>> 15), 1 | saat);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    const zwischen = (a, b) => a + zufall() * (b - a);

    // Formen und Farben einmal bauen und für alle Bäume wiederverwenden (spart Arbeit)
    const stammForm  = new THREE.CylinderGeometry(0.2, 0.28, 1, 8);
    const kegelForm  = new THREE.ConeGeometry(1, 1, 9);
    const kugelForm  = new THREE.IcosahedronGeometry(1, 1);
    const stammFarbe = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 1 });
    const blattFarben = [0x2e7d32, 0x388e3c, 0x1b5e20, 0x43a047, 0x558b2f].map(
      c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true })
    );
    const busch = new THREE.MeshStandardMaterial({ color: 0x33691e, roughness: 1, flatShading: true });
    const pilzHut = new THREE.MeshStandardMaterial({ color: 0xe53935 });
    const pilzPunkt = new THREE.MeshStandardMaterial({ color: 0xffffff });

    function teil(form, material, x, y, z, sx, sy, sz) {
      const m = new THREE.Mesh(form, material);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      m.castShadow = true;
      m.receiveShadow = true;
      szene.add(m);
      return m;
    }

    // Tannenbaum: Stamm + 3 Kegel übereinander
    function tanne(x, z, groesse) {
      const blatt = blattFarben[Math.floor(zufall() * blattFarben.length)];
      teil(stammForm, stammFarbe, x, 0.6 * groesse, z, groesse, 1.2 * groesse, groesse);
      for (let i = 0; i < 3; i++) {
        const breite = (1.4 - i * 0.35) * groesse;
        teil(kegelForm, blatt, x, (1.6 + i * 1.0) * groesse, z, breite, 1.6 * groesse, breite);
      }
      return 4.2 * groesse; // Höhe
    }
    // Laubbaum: Stamm + mehrere dicke Blätter-Kugeln
    function laubbaum(x, z, groesse) {
      const blatt = blattFarben[Math.floor(zufall() * blattFarben.length)];
      teil(stammForm, stammFarbe, x, 1.1 * groesse, z, groesse, 2.2 * groesse, groesse);
      teil(kugelForm, blatt, x, 2.9 * groesse, z, 1.3 * groesse, 1.1 * groesse, 1.3 * groesse);
      for (let i = 0; i < 3; i++) {
        const w = zufall() * Math.PI * 2;
        teil(kugelForm, blatt, x + Math.cos(w) * 0.7 * groesse, (2.5 + zufall() * 0.8) * groesse,
             z + Math.sin(w) * 0.7 * groesse, 0.8 * groesse, 0.7 * groesse, 0.8 * groesse);
      }
      return 4 * groesse;
    }

    // --- Straßenlaternen am Straßenrand ---
    const mastFarbe = new THREE.MeshStandardMaterial({ color: 0x546e7a, roughness: 0.5, metalness: 0.4 });
    const lampenLicht = new THREE.MeshStandardMaterial({ color: 0xfff59d, emissive: 0xffeb3b, emissiveIntensity: 1.5 });
    const mastForm = new THREE.CylinderGeometry(0.09, 0.12, 1, 8);
    function laterne(x, z, armX, armZ) {
      teil(mastForm, mastFarbe, x, 2, z, 1, 4, 1);                             // Mast (4 hoch)
      const arm = teil(mastForm, mastFarbe, x + armX * 0.5, 3.95, z + armZ * 0.5, 0.6, 1, 0.6);
      arm.rotation.set(armZ * Math.PI / 2, 0, -armX * Math.PI / 2);            // Arm zur Straße hin
      teil(kugelForm, lampenLicht, x + armX, 3.85, z + armZ, 0.22, 0.15, 0.22); // leuchtende Lampe
      bloecke.push({ x, z, b: 0.3, t: 0.3, unten: 0, oben: 4, art: 'block' });   // Mast ist fest
    }
    for (let z = 14; z < WIESE.z2; z += 12) {          // an der Hauptstraße, abwechselnd links/rechts
      if (Math.abs(z - 50) < 6) continue;              // nicht auf der Kreuzung
      const seite = (z / 12) % 2 < 1 ? 1 : -1;
      laterne(seite * 3.6, z, -seite, 0);
    }
    for (let x = WIESE.x1 + 6; x < WIESE.x2; x += 12) { // an der Querstraße
      if (Math.abs(x) < 6) continue;
      const seite = (x / 12) % 2 < 1 ? 1 : -1;
      laterne(x, 50 + seite * 3.6, 0, -seite);
    }

    // Wo darf ein Baum stehen? Im Wald-Gebiet, nicht zu nah an anderen Sachen
    const waldGebiete = [
      { x1: 13.5, x2: 59.5, z1: -24.5, z2: 15 },    // rechts
      { x1: -59.5, x2: -25, z1: -24.5, z2: 15 },    // links
      { x1: -59.5, x2: 59.5, z1: 15, z2: 94.5 },    // der große Wald vorne
    ];
    // Ein zufälliges Wald-Gebiet wählen – große Gebiete kommen öfter dran
    const flaechen = waldGebiete.map(g => (g.x2 - g.x1) * (g.z2 - g.z1));
    const gesamt = flaechen.reduce((a, b) => a + b, 0);
    function zufallsGebiet() {
      let r = zufall() * gesamt;
      for (let i = 0; i < waldGebiete.length; i++) { r -= flaechen[i]; if (r <= 0) return waldGebiete[i]; }
      return waldGebiete[0];
    }
    const freiHalten = [
      { x: KABINE.x, z: KABINE.z, r: 4 },           // Umkleidekabine
      { x: 0, z: 0, r: 4 },                         // Startplatz
      { x: 0, z: 50, r: 9 },                        // Platz an der Kreuzung
      { x: 16, z: 62, r: 13 },                      // Garage
    ];
    const baumOrte = [];
    let versuche = 0;
    while (baumOrte.length < 220 && versuche < 8000) {
      versuche++;
      const g = zufallsGebiet();
      const x = zwischen(g.x1, g.x2), z = zwischen(g.z1, g.z2);
      if (baumOrte.some(o => Math.hypot(o.x - x, o.z - z) < 2.8)) continue;
      if (freiHalten.some(o => Math.hypot(o.x - x, o.z - z) < o.r)) continue;
      if (nahAnStrasse(x, z, 2)) continue;          // nicht auf die Straße pflanzen
      if (bloecke.some(o => Math.abs(o.x - x) < o.b / 2 + 1 && Math.abs(o.z - z) < o.t / 2 + 1)) continue;
      baumOrte.push({ x, z });
    }
    for (const { x, z } of baumOrte) {
      const groesse = zwischen(0.8, 1.4);
      const hoehe = zufall() < 0.5 ? tanne(x, z, groesse) : laubbaum(x, z, groesse);
      // Unsichtbarer Klotz am Stamm: man kann nicht durch Bäume laufen
      bloecke.push({ x, z, b: 0.5 * groesse, t: 0.5 * groesse, unten: 0, oben: hoehe, art: 'block' });
    }

    // Büsche und Pilze zwischen den Bäumen (nur Deko, man kann durchlaufen)
    for (let i = 0; i < 140; i++) {
      const g = zufallsGebiet();
      const x = zwischen(g.x1, g.x2), z = zwischen(g.z1, g.z2);
      if (freiHalten.some(o => Math.hypot(o.x - x, o.z - z) < o.r)) continue;
      if (nahAnStrasse(x, z, 0.5)) continue;
      if (zufall() < 0.65) {
        const s = zwischen(0.4, 0.8);
        teil(kugelForm, busch, x, s * 0.5, z, s, s * 0.8, s);
      } else {
        const s = zwischen(0.6, 1.1);
        teil(stammForm, pilzPunkt, x, 0.12 * s, z, 0.35 * s, 0.25 * s, 0.35 * s); // Stiel
        teil(kugelForm, pilzHut, x, 0.27 * s, z, 0.22 * s, 0.12 * s, 0.22 * s); // roter Hut
        teil(kugelForm, pilzPunkt, x + 0.08 * s, 0.36 * s, z, 0.03 * s, 0.03 * s, 0.03 * s); // Punkt
        teil(kugelForm, pilzPunkt, x - 0.06 * s, 0.37 * s, z + 0.06 * s, 0.025 * s, 0.025 * s, 0.025 * s);
      }
    }

    // Ist der Affe in der Kabine?
    function inKabine(p) {
      return Math.abs(p.x - kx) < 1.3 && Math.abs(p.z - kz) < 1.3 && p.y < 1.5;
    }

    // Farben zum Aussuchen
    const FELL_FARBEN = [
      ['Dunkelbraun', 0x3b2314], ['Hellbraun', 0x8b5a2b], ['Schwarz', 0x1a1a1a],
      ['Grau', 0x8a8a8a], ['Weiß', 0xf2f2f2], ['Rot', 0xd32f2f],
      ['Orange', 0xf57c00], ['Gelb', 0xfdd835], ['Grün', 0x43a047],
      ['Blau', 0x1e88e5], ['Lila', 0x8e24aa], ['Pink', 0xf06292],
      ['Gold', 0xd4a017], ['Regenbogen', 'regenbogen'],
    ];
    let regenbogen = false;

    function fellFarbeSetzen(wert) {
      regenbogen = wert === 'regenbogen';
      if (!regenbogen) fell.color.set(wert);
      try { localStorage.setItem('affenFarbe', String(wert)); } catch (e) {} // Farbe merken
      for (const knopf of farbKnoepfe) knopf.classList.toggle('gewaehlt', knopf.dataset.wert === String(wert));
    }

    // Menü-Knöpfe bauen
    const kabinenMenue = document.getElementById('kabine');
    const farbFeld = document.getElementById('farben');
    const farbKnoepfe = FELL_FARBEN.map(([name, wert]) => {
      const knopf = document.createElement('button');
      knopf.title = name;
      knopf.dataset.wert = String(wert);
      knopf.tabIndex = -1;
      knopf.style.background = wert === 'regenbogen'
        ? 'conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red)'
        : '#' + wert.toString(16).padStart(6, '0');
      knopf.innerHTML = `<span>${name}</span>`;
      knopf.addEventListener('mousedown', (e) => e.preventDefault()); // Knopf soll die Tastatur nicht "klauen"
      knopf.addEventListener('click', () => fellFarbeSetzen(wert));
      farbFeld.appendChild(knopf);
      return knopf;
    });

    // Gespeicherte Farbe vom letzten Mal laden
    let gespeichert = null;
    try { gespeichert = localStorage.getItem('affenFarbe'); } catch (e) {}
    const gefunden = FELL_FARBEN.find(([, wert]) => String(wert) === gespeichert);
    fellFarbeSetzen(gefunden ? gefunden[1] : 0x3b2314);

    // ================= OBBY =================
    // Startet hinten am Ende der Wiese (z = -25) und geht über den Abgrund.
    // Plattform: [x, z, breite, tiefe, höhe der Oberseite, art]
    const D = 0.5; // Dicke einer Plattform
    const obby = [
      // Teil 1: Treppe über den Abgrund
      [ 0, -28,   3,   3,   0.5],
      [ 0, -32,   2,   2,   1.0],
      [ 2, -36,   2,   2,   1.5],
      [ 0, -40,   2,   2,   2.0],
      [ 0, -45,   4,   4,   2.0, 'checkpoint'],   // Checkpoint 1
      // Teil 2: langer Steg mit Lava-Streifen – drüberspringen!
      [ 0, -53,   3,  10,   2.0],
      // Teil 3: schmaler Balken
      [ 0, -62,   0.6, 6,   2.0],
      // Teil 4: hoch hinaus – hier brauchst du den Doppelsprung
      [ 0, -68,   2,   2,   4.0],
      [ 3, -72,   1.5, 1.5, 4.5],
      [ 0, -76,   1.5, 1.5, 5.0],
      [ 0, -81,   4,   4,   5.0, 'checkpoint'],   // Checkpoint 2
      // Teil 5: kleine Inseln mit Lava-Rand
      [ 0, -87,   2,   2,   5.0],
      [-3, -91,   2,   2,   5.0],
      [ 0, -95,   2,   2,   5.0],
      // Teil 6: großer Doppelsprung
      [ 0,-102,   2,   2,   6.0],
      [ 0,-108,   5,   5,   6.0, 'checkpoint'],   // Checkpoint 3
      // Teil 7: Zickzack über kleine Plattformen
      [ 2.5,-112.5, 1.2, 1.2, 6.0],
      [-1, -116,  1.2, 1.2, 6.0],
      [ 2, -119.5,1.2, 1.2, 6.0],
      [-1.5,-123, 1.2, 1.2, 6.0],
      // Teil 8: Plattform, die hin und her fährt (links-rechts)
      [ 0, -129,  2.5, 2.5, 6.0, 'block', { achse: 'x', weite: 3, tempo: 1.2 }],
      [ 0, -135,  2,   2,   6.0],
      // Teil 9: Riesentreppe – jede Stufe braucht einen Doppelsprung
      [ 0, -139,  2,   2,   7.5],
      [ 2.5,-142.5,2,  2,   9.0],
      [ 0, -146,  2,   2,  10.5],
      [ 0, -151,  4,   4,  10.5, 'checkpoint'],   // Checkpoint 4
      // Teil 10: Lava-Gang – weiche den Lava-Streifen aus
      [ 0, -161,  4,  14,  10.5],
      // Teil 11: Plattform, die vor und zurück fährt
      [ 0, -175,  2,   2,  10.5, 'block', { achse: 'z', weite: 3, tempo: 1.0 }],
      [ 0, -183,  3,   3,  10.5, 'checkpoint'],   // Checkpoint 5
      // Teil 12: sehr schmaler, langer Balken
      [ 0, -191,  0.5, 8,  10.5],
      // Teil 13: letzter großer Doppelsprung zum Ziel
      [ 0, -198,  1.5, 1.5, 11.5],
      [ 0, -205,  6,   6,  12.0, 'ziel'],         // ZIEL
    ];
    const fahrendeBloecke = [];
    for (const [x, z, b, t, oben, art, bewegung] of obby) {
      const block = neuerBlock(x, z, b, t, oben - D, oben, art ?? 'block', 0xb0bec5);
      if (bewegung) {
        block.bewegung = bewegung;
        block.startX = x; block.startZ = z;
        block.mesh.material.color.set(0xab47bc); // fahrende Plattformen sind lila
        fahrendeBloecke.push(block);
      }
    }

    // Fahrende Plattformen bewegen. Gibt zurück, wie weit sich jede bewegt hat.
    function plattformenBewegen(zeit) {
      for (const o of fahrendeBloecke) {
        const altX = o.x, altZ = o.z;
        const versatz = Math.sin(zeit * o.bewegung.tempo) * o.bewegung.weite;
        if (o.bewegung.achse === 'x') o.x = o.startX + versatz;
        else o.z = o.startZ + versatz;
        o.mesh.position.x = o.x;
        o.mesh.position.z = o.z;
        o.dx = o.x - altX; o.dz = o.z - altZ; // so weit ist sie in diesem Bild gefahren
      }
    }
    // Lava: [x, z, breite, tiefe, höhe des Bodens darunter]
    const lavaListe = [
      [ 0, -50,   3,   1,   2.0],  // Streifen auf dem langen Steg
      [ 0, -54,   3,   1,   2.0],
      [ 0, -87.5, 2,   0.5, 5.0],  // Lava-Kante auf der ersten Insel
      [-3, -91,   0.5, 2,   5.0],  // Lava in der Mitte der zweiten Insel
      // Lava-Gang (Teil 10): Streifen, mal ganz breit, mal nur auf einer Seite
      [ 0,  -156, 4,   1,  10.5],
      [-1,  -159, 2,   1,  10.5],  // nur links – rechts vorbei!
      [ 1,  -162, 2,   1,  10.5],  // nur rechts – links vorbei!
      [ 0,  -165, 4,   1,  10.5],
    ];
    for (const [x, z, b, t, h] of lavaListe) neuerBlock(x, z, b, t, h, h + 0.15, 'lava');

    // Prüft, ob der Affe (Mitte px/py/pz, Größe 1) einen Block berührt
    function ueberlappt(o, px, py, pz) {
      return Math.abs(px - o.x) < (o.b + 1) / 2 - 0.001 &&
             Math.abs(pz - o.z) < (o.t + 1) / 2 - 0.001 &&
             py - 0.5 < o.oben - 0.001 && py + 0.5 > o.unten + 0.001;
    }

    // Prüft: Steht ein fester Block im Weg? (Lava hält dich nicht auf – sie ist tödlich)
    function stoesstAn(px, py, pz) {
      return bloecke.some(o => o.art !== 'lava' && ueberlappt(o, px, py, pz)) ||
        // geparkte Fahrzeuge sind auch im Weg (außer man steht schon oben drauf)
        fahrzeuge.some(f => f !== aktuellesFahrzeug && py - 0.5 < f.hoehe - 0.05 && punktInFahrzeug(f, px, pz, 0.45));
    }

    // Was ist unter dem Affen? Gibt Höhe und Block zurück (oder -Unendlich = Abgrund)
    function bodenUnter(px, py, pz) {
      let hoehe = -Infinity, block = null;
      if (px >= WIESE.x1 - 0.5 && px <= WIESE.x2 + 0.5 && pz >= WIESE.z1 - 0.5 && pz <= WIESE.z2 + 0.5 && py - 0.5 >= -0.05) {
        hoehe = 0; // auf der Wiese
      }
      for (const o of bloecke) {
        if (o.art === 'lava') continue;
        const drueber = Math.abs(px - o.x) < (o.b + 1) / 2 - 0.001 &&
                        Math.abs(pz - o.z) < (o.t + 1) / 2 - 0.001;
        if (drueber && py - 0.5 >= o.oben - 0.05 && o.oben > hoehe) { hoehe = o.oben; block = o; }
      }
      // Man kann auch auf Fahrzeuge draufspringen
      for (const f of fahrzeuge) {
        if (f !== aktuellesFahrzeug && punktInFahrzeug(f, px, pz, 0.45) && py - 0.5 >= f.hoehe - 0.05 && f.hoehe > hoehe) {
          hoehe = f.hoehe; block = null;
        }
      }
      return { hoehe, block };
    }

    // Berührt der Affe Lava?
    function inLava(px, py, pz) {
      return bloecke.some(o => o.art === 'lava' &&
        Math.abs(px - o.x) < (o.b + 1) / 2 - 0.001 &&
        Math.abs(pz - o.z) < (o.t + 1) / 2 - 0.001 &&
        py - 0.5 <= o.oben + 0.01 && py + 0.5 >= o.unten);
    }

    // --- Startpunkt: hier taucht der Affe nach dem Runterfallen wieder auf ---
    const startPunkt = new THREE.Vector3(0, 0.5, 0);
    let letzterCheckpoint = null;
    let imZiel = false;
    let zurueckZumStartUm = 0;  // wann der Affe nach dem Ziel zurück zum Start kommt
    let stehtAufLetztes = null; // auf welchem Block der Affe im letzten Bild stand

    // Große Meldung in der Mitte (z. B. "Checkpoint!")
    const meldung = document.getElementById('meldung');
    let meldungBis = 0;
    function zeigeMeldung(text, sekunden = 2) {
      meldung.textContent = text;
      meldung.style.opacity = 1;
      meldungBis = spielZeit + sekunden;
    }

    // Zurück zum letzten Startpunkt (nach Lava oder Runterfallen)
    function neuStart(grund) {
      affe.position.copy(startPunkt);
      fallTempo = 0;
      zeigeMeldung(grund, 1.5);
    }

    // --- Münzen: goldene Scheiben, die Punkte geben ---
    // [x, z, höhe des Untergrunds]  (0 = Gras, sonst Oberseite eines Blocks)
    const muenzOrte = [
      [ 2,  2, 0], [-3,  3, 0], [ 0, -5, 0], [-6,-10, 0], [ 4,-12, 0],
      [10, -6, 0], [-10,-4, 0], [ 7,  8, 0], [-5,  8, 0], [12,  4, 0],
      [ 3, -3, 1],   // auf dem braunen Block
      [ 5,  4, 1.5], // auf dem kleinen Turm
      [-2,-14, 1],   // auf dem grauen Block hinten
      [ 9,  0, 2],   // auf der blauen Wand (Doppelsprung!)
      [-4, -6, 2],   // auf der braunen Wand (Doppelsprung!)
      // Münzen in der Obby
      [ 0,-32, 1.0], [ 0,-40, 2.0], [ 0,-52, 2.0], [ 0,-62, 2.0],
      [ 3,-72, 4.5], [ 0,-95, 5.0], [ 0,-102, 6.0],
      // Münzen auf den Straßen
      [-1, 22, 0], [ 1, 34, 0], [-1, 64, 0], [ 1, 76, 0], [-1, 88, 0],
      [-48, 51, 0], [-30, 49, 0], [-14, 51, 0], [14, 49, 0], [30, 51, 0], [48, 49, 0],
      [-1,-116, 6.0], [ 0,-135, 6.0], [ 0,-146, 10.5], [ 1,-159, 10.5], [ 0,-191, 10.5], [ 0,-198, 11.5],
    ];
    const muenzForm = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 24);
    const muenzFarbe = new THREE.MeshStandardMaterial({
      color: 0xffd700, emissive: 0x664400, metalness: 0.3, roughness: 0.3
    });
    const muenzen = muenzOrte.map(([x, z, h]) => {
      const muenze = new THREE.Mesh(muenzForm, muenzFarbe);
      muenze.rotation.x = Math.PI / 2; // hochkant stellen
      muenze.position.set(x, h + 0.8, z);
      muenze.castShadow = true;
      szene.add(muenze);
      return muenze;
    });

    // Punkte-Anzeige oben rechts
    const PUNKTE_PRO_MUENZE = 10;
    const WIEDERKOMMEN_NACH = 7; // Sekunden, bis eine eingesammelte Münze wieder da ist
    let spielZeit = 0;           // Sekunden seit Spielstart
    let punkte = 0;
    const punkteAnzeige = document.getElementById('punkte');
    function punkteZeigen() {
      punkteAnzeige.textContent = `🪙 ${punkte} Punkte`;
    }
    punkteZeigen();

    // --- Tasten merken: welche Taste ist gerade gedrückt? ---
    const tasten = {};
    addEventListener('keydown', (e) => {
      tasten[e.code] = true;
      if (e.code === 'Space' && !e.repeat) sprungGedrueckt = true; // nur neues Drücken zählt, nicht Gedrückthalten
      if (e.code === 'KeyE' && !e.repeat) eGedrueckt = true;       // E = ein- oder aussteigen
      if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); // Seite nicht scrollen
    });
    addEventListener('keyup', (e) => { tasten[e.code] = false; });

    // --- Spielwerte ---
    const TEMPO = 6;          // wie schnell der Affe läuft
    const SPRUNGKRAFT = 7;    // wie stark er springt
    const SCHWERKRAFT = 20;   // wie stark er nach unten fällt
    let fallTempo = 0;        // aktuelle Geschwindigkeit nach oben/unten
    const MAX_SPRUENGE = 2;   // 2 = Doppelsprung
    let sprungZaehler = 0;    // wie oft er seit dem letzten Landen gesprungen ist
    let sprungGedrueckt = false;

    // --- Kamera-Werte ---
    const KAMERA_ABSTAND = 10;   // wie weit die Kamera vom Affe weg ist
    const DREH_TEMPO = 2;        // wie schnell sich die Kamera dreht
    let kameraWinkel = 0;        // 0 = Kamera schaut von hinten
    let kameraNeigung = 0.5;     // wie schräg von oben die Kamera schaut
    let kameraAbstand = KAMERA_ABSTAND; // beim Fahren geht die Kamera etwas weiter weg

    // ================= GARAGE & FAHRZEUGE =================
    // Die Garage steht rechts neben der Kreuzung. Das große Tor zeigt zur Querstraße.
    const GARAGE = { x: 16, z: 62 };
    const gx = GARAGE.x, gz = GARAGE.z;
    const GARAGEN_FARBE = 0xbcaaa4;
    neuerBlock(gx,        gz + 4.85, 16,  0.3, 0, 4,   'block', GARAGEN_FARBE); // Rückwand
    neuerBlock(gx - 7.85, gz,        0.3, 10,  0, 4,   'block', GARAGEN_FARBE); // linke Wand
    neuerBlock(gx + 7.85, gz,        0.3, 10,  0, 4,   'block', GARAGEN_FARBE); // rechte Wand
    neuerBlock(gx,        gz,        16.6, 10.6, 4, 4.3, 'block', 0x6d4c41);    // Dach
    flach(new THREE.MeshStandardMaterial({ color: 0x9e9e9e }), gx, gz, 15.4, 9.7, 0.012); // Betonboden
    flach(asphalt, gx, gz - 7, 15, 4.2, 0.011);                                            // Einfahrt zur Straße
    for (const lx of [-4.6, -1.5, 1.6, 4.6]) flach(linie, gx + lx, gz + 0.5, 0.1, 6, 0.03); // Parklinien
    // Schild "GARAGE" über dem Tor
    {
      const lw = document.createElement('canvas');
      lw.width = 512; lw.height = 128;
      const pi = lw.getContext('2d');
      pi.fillStyle = '#263238'; pi.fillRect(0, 0, 512, 128);
      pi.fillStyle = '#ffca28'; pi.font = 'bold 84px sans-serif';
      pi.textAlign = 'center'; pi.textBaseline = 'middle';
      pi.fillText('🏎 GARAGE', 256, 68);
      const tex = new THREE.CanvasTexture(lw);
      tex.colorSpace = THREE.SRGBColorSpace;
      const garagenSchild = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: tex }));
      garagenSchild.position.set(gx, 4.9, gz - 5.35);
      garagenSchild.rotation.y = Math.PI; // schaut zur Straße
      szene.add(garagenSchild);
    }

    // --- Bausteine für Fahrzeuge ---
    const reifen = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.9 });
    const felge  = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, metalness: 0.6, roughness: 0.3 });
    const glas   = new THREE.MeshStandardMaterial({ color: 0x90caf9, transparent: true, opacity: 0.5 });
    const chrom  = new THREE.MeshStandardMaterial({ color: 0xeceff1, metalness: 0.8, roughness: 0.2 });
    const vorderLicht = new THREE.MeshStandardMaterial({ color: 0xffffe0, emissive: 0xffffaa, emissiveIntensity: 1.2 });
    const ruecklicht  = new THREE.MeshStandardMaterial({ color: 0xff1744, emissive: 0xaa0000 });
    const dunkel = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.7 });

    function kiste(eltern, b, h, l, material, x, y, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(b, h, l), material);
      m.position.set(x, y, z);
      m.castShadow = true; m.receiveShadow = true;
      eltern.add(m);
      return m;
    }
    // Rad: Lenk-Halter (dreht nach links/rechts) > Dreh-Halter (rollt) > Reifen + Felge
    function rad(f, r, breite, x, y, z, vorne) {
      const lenkHalter = new THREE.Group();
      lenkHalter.position.set(x, y, z);
      f.karosserie.add(lenkHalter);
      const drehHalter = new THREE.Group();
      lenkHalter.add(drehHalter);
      const reifenMesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, breite, 18), reifen);
      reifenMesh.rotation.z = Math.PI / 2;
      reifenMesh.castShadow = true;
      drehHalter.add(reifenMesh);
      const felgenMesh = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, breite + 0.02, 6), felge);
      felgenMesh.rotation.z = Math.PI / 2;
      drehHalter.add(felgenMesh);
      f.raeder.push({ lenkHalter, drehHalter, r, vorne });
    }
    function lichter(f, b, y, vorneZ, hintenZ) {
      for (const s of [-1, 1]) {
        kiste(f.karosserie, 0.3, 0.15, 0.06, vorderLicht, s * b, y, vorneZ);
        kiste(f.karosserie, 0.3, 0.12, 0.06, ruecklicht, s * b, y, hintenZ);
      }
    }

    // --- Die Fahrzeuge ---
    // maxTempo in Meter pro Sekunde (× 3,6 = km/h), beschl = wie schnell es schneller wird,
    // lenk = wie scharf es um die Kurve fährt, sitz = wo der Affe sitzt
    const FAHRZEUG_TYPEN = {
      auto:    { name: 'Cabrio',      emoji: '🚗', maxTempo: 17, beschl: 9,  lenk: 1.8, breite: 1.9, laenge: 3.8, hoehe: 1.2, sitz: [0, 1.0, -0.3],  hupe: 440 },
      sport:   { name: 'Sportwagen',  emoji: '🏎️', maxTempo: 28, beschl: 14, lenk: 2.0, breite: 1.9, laenge: 4.1, hoehe: 1.0, sitz: [0, 0.85, -0.4], hupe: 660 },
      monster: { name: 'Monstertruck',emoji: '🛻', maxTempo: 14, beschl: 8,  lenk: 1.5, breite: 2.7, laenge: 4.2, hoehe: 2.3, sitz: [0, 2.15, 0.1],  hupe: 200 },
      motorrad:{ name: 'Motorrad',    emoji: '🏍️', maxTempo: 24, beschl: 15, lenk: 2.6, breite: 0.8, laenge: 2.1, hoehe: 1.1, sitz: [0, 1.15, -0.25], hupe: 880 },
      kart:    { name: 'Go-Kart',     emoji: '🏁', maxTempo: 19, beschl: 18, lenk: 3.0, breite: 1.3, laenge: 2.0, hoehe: 0.6, sitz: [0, 0.65, -0.25], hupe: 1100 },
    };

    function bauen(typ, karosserie) {
      if (typ === 'auto') {                           // rotes Cabrio
        const lack = new THREE.MeshStandardMaterial({ color: 0xe53935, metalness: 0.3, roughness: 0.4 });
        kiste(karosserie, 1.8, 0.55, 3.7, lack, 0, 0.6, 0);
        kiste(karosserie, 1.8, 0.25, 1.2, lack, 0, 0.98, 1.0);        // Motorhaube etwas höher
        kiste(karosserie, 1.8, 0.35, 0.9, lack, 0, 1.03, -1.35);      // Heck
        kiste(karosserie, 1.0, 0.5, 0.25, dunkel, 0, 1.1, -0.85);     // Rückenlehne
        const scheibe = kiste(karosserie, 1.6, 0.45, 0.06, glas, 0, 1.3, 0.38);
        scheibe.rotation.x = -0.4;
        kiste(karosserie, 1.84, 0.12, 0.1, chrom, 0, 0.45, 1.86);     // Stoßstange
      } else if (typ === 'sport') {                   // blauer Sportwagen mit Streifen und Spoiler
        const lack = new THREE.MeshStandardMaterial({ color: 0x1565c0, metalness: 0.5, roughness: 0.25 });
        const weissLack = new THREE.MeshStandardMaterial({ color: 0xffffff });
        kiste(karosserie, 1.9, 0.45, 4.0, lack, 0, 0.5, 0);
        const nase = kiste(karosserie, 1.9, 0.2, 1.3, lack, 0, 0.8, 1.2);
        nase.rotation.x = 0.12;
        kiste(karosserie, 0.45, 0.02, 4.02, weissLack, 0, 0.735, 0);  // Rennstreifen
        kiste(karosserie, 1.0, 0.45, 0.25, dunkel, 0, 0.95, -0.95);   // Rückenlehne
        const scheibe = kiste(karosserie, 1.6, 0.35, 0.06, glas, 0, 1.0, 0.35);
        scheibe.rotation.x = -0.6;
        for (const s of [-1, 1]) kiste(karosserie, 0.08, 0.35, 0.08, dunkel, s * 0.7, 0.9, -1.8);
        kiste(karosserie, 1.9, 0.06, 0.45, dunkel, 0, 1.08, -1.85);   // Spoiler
      } else if (typ === 'monster') {                 // grüner Monstertruck mit Riesenrädern
        const lack = new THREE.MeshStandardMaterial({ color: 0x43a047, roughness: 0.5 });
        kiste(karosserie, 2.0, 0.5, 3.8, lack, 0, 1.45, 0);
        kiste(karosserie, 2.0, 0.4, 1.2, lack, 0, 1.9, 1.3);          // Motorhaube
        kiste(karosserie, 0.2, 0.5, 1.6, lack, -0.9, 1.95, -1.1);     // Ladefläche Seiten
        kiste(karosserie, 0.2, 0.5, 1.6, lack, 0.9, 1.95, -1.1);
        kiste(karosserie, 1.0, 0.6, 0.25, dunkel, 0, 2.0, -0.35);     // Sitzlehne
        const buegel = kiste(karosserie, 2.0, 0.12, 0.12, chrom, 0, 2.9, -0.4); // Überrollbügel
        for (const s of [-1, 1]) kiste(karosserie, 0.12, 1.0, 0.12, chrom, s * 0.95, 2.4, -0.4);
        kiste(karosserie, 1.4, 0.15, 0.15, chrom, 0, 2.4, 1.95);      // Scheinwerfer-Bügel
        buegel.castShadow = true;
      } else if (typ === 'motorrad') {                // orange-schwarzes Motorrad
        const lack = new THREE.MeshStandardMaterial({ color: 0xff6d00, metalness: 0.4, roughness: 0.3 });
        kiste(karosserie, 0.25, 0.3, 1.3, dunkel, 0, 0.6, 0);         // Rahmen
        kiste(karosserie, 0.4, 0.28, 0.6, lack, 0, 0.88, 0.25);       // Tank
        kiste(karosserie, 0.32, 0.12, 0.7, dunkel, 0, 0.82, -0.35);   // Sitz
        kiste(karosserie, 0.3, 0.25, 0.4, lack, 0, 0.75, -0.75);      // Heck
        const gabel = kiste(karosserie, 0.08, 0.7, 0.08, chrom, 0, 0.75, 0.75);
        gabel.rotation.x = 0.35;
        kiste(karosserie, 0.9, 0.06, 0.06, chrom, 0, 1.12, 0.62);     // Lenker
        kiste(karosserie, 0.22, 0.16, 0.08, vorderLicht, 0, 0.98, 0.85);
        kiste(karosserie, 0.16, 0.1, 0.05, ruecklicht, 0, 0.82, -0.97);
        kiste(karosserie, 0.12, 0.12, 0.6, chrom, 0.2, 0.42, -0.45);  // Auspuff
      } else if (typ === 'kart') {                    // gelbes Go-Kart
        const lack = new THREE.MeshStandardMaterial({ color: 0xfdd835, roughness: 0.4 });
        kiste(karosserie, 1.1, 0.12, 1.9, dunkel, 0, 0.18, 0);        // Bodenplatte
        kiste(karosserie, 0.9, 0.25, 0.5, lack, 0, 0.3, 0.8);         // Front
        kiste(karosserie, 0.6, 0.45, 0.2, lack, 0, 0.45, -0.55);      // Sitzlehne
        kiste(karosserie, 0.6, 0.3, 0.35, dunkel, 0, 0.35, -0.85);    // Motor
        const lenkrad = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.03, 8, 16), dunkel);
        lenkrad.position.set(0, 0.62, 0.35); lenkrad.rotation.x = -0.6;
        karosserie.add(lenkrad);
        kiste(karosserie, 1.4, 0.1, 0.12, lack, 0, 0.25, 1.0);        // Stoßstange vorne
      }
    }

    const fahrzeuge = [];
    function neuesFahrzeug(typ, x, z, richtung) {
      const f = { ...FAHRZEUG_TYPEN[typ], typ, x, z, richtung, tempo: 0, lenkung: 0, raeder: [] };
      f.gruppe = new THREE.Group();
      f.karosserie = new THREE.Group(); // darin ist alles, was sich (beim Motorrad) zur Seite neigt
      f.gruppe.add(f.karosserie);
      szene.add(f.gruppe);
      bauen(typ, f.karosserie);
      if (typ === 'auto')     { for (const s of [-1, 1]) { rad(f, 0.38, 0.3, s * 0.9, 0.38, 1.2, true); rad(f, 0.38, 0.3, s * 0.9, 0.38, -1.2, false); } lichter(f, 0.6, 0.65, 1.86, -1.86); }
      if (typ === 'sport')    { for (const s of [-1, 1]) { rad(f, 0.36, 0.32, s * 0.95, 0.36, 1.3, true); rad(f, 0.4, 0.38, s * 0.95, 0.4, -1.3, false); } lichter(f, 0.65, 0.55, 2.01, -2.01); }
      if (typ === 'monster')  { for (const s of [-1, 1]) { rad(f, 0.8, 0.65, s * 1.2, 0.8, 1.35, true); rad(f, 0.8, 0.65, s * 1.2, 0.8, -1.35, false); } lichter(f, 0.6, 1.5, 1.91, -1.91); }
      if (typ === 'motorrad') { rad(f, 0.36, 0.16, 0, 0.36, 0.8, true); rad(f, 0.36, 0.2, 0, 0.36, -0.8, false); }
      if (typ === 'kart')     { for (const s of [-1, 1]) { rad(f, 0.22, 0.22, s * 0.65, 0.22, 0.7, true); rad(f, 0.25, 0.28, s * 0.65, 0.25, -0.7, false); } }
      f.gruppe.traverse(m => { if (m.isMesh) m.castShadow = true; });
      fahrzeugZeigen(f);
      fahrzeuge.push(f);
      return f;
    }
    function fahrzeugZeigen(f) {
      f.gruppe.position.set(f.x, 0, f.z);
      f.gruppe.rotation.y = f.richtung;
    }

    // Alle Fahrzeuge stehen in der Garage, mit der Nase zum Tor (Richtung = π heißt: schaut nach -z)
    neuesFahrzeug('auto',     gx - 6.0, gz + 0.5, Math.PI);
    neuesFahrzeug('sport',    gx - 2.9, gz + 0.5, Math.PI);
    neuesFahrzeug('monster',  gx + 0.5, gz + 0.5, Math.PI);
    neuesFahrzeug('motorrad', gx + 3.4, gz + 0.5, Math.PI);
    neuesFahrzeug('kart',     gx + 5.9, gz + 0.5, Math.PI);

    // Liegt ein Punkt (mit Abstand r) in einem Fahrzeug? Rechnet in die Sicht des Fahrzeugs um.
    function punktInFahrzeug(f, px, pz, r) {
      const s = Math.sin(f.richtung), c = Math.cos(f.richtung);
      const dx = px - f.x, dz = pz - f.z;
      const vorne = dx * s + dz * c;   // wie weit vorne/hinten
      const seitlich = dx * c - dz * s; // wie weit links/rechts
      return Math.abs(vorne) < f.laenge / 2 + r && Math.abs(seitlich) < f.breite / 2 + r;
    }
    // Punkte entlang der Mittellinie des Fahrzeugs (für Zusammenstöße)
    function fahrzeugPunkte(f, x, z, richtung) {
      const s = Math.sin(richtung), c = Math.cos(richtung);
      const halb = f.breite / 2, strecke = f.laenge / 2 - halb;
      const anzahl = Math.max(1, Math.ceil(f.laenge / f.breite));
      const punkte = [];
      for (let i = 0; i <= anzahl; i++) {
        const t = -strecke + (2 * strecke * i) / anzahl;
        punkte.push([x + s * t, z + c * t]);
      }
      return punkte;
    }
    // Würde das Fahrzeug an dieser Stelle irgendwo anstoßen?
    function fahrzeugStoesst(f, x, z, richtung) {
      const halb = f.breite / 2;
      for (const [px, pz] of fahrzeugPunkte(f, x, z, richtung)) {
        if (px < WIESE.x1 + halb || px > WIESE.x2 - halb || pz < WIESE.z1 + halb || pz > WIESE.z2 - halb) return true;
        for (const o of bloecke) {
          if (o.art === 'lava' || o.unten > f.hoehe || o.oben < 0.1) continue;
          if (Math.abs(px - o.x) < o.b / 2 + halb && Math.abs(pz - o.z) < o.t / 2 + halb) return true;
        }
        for (const g of fahrzeuge) if (g !== f && punktInFahrzeug(g, px, pz, halb)) return true;
      }
      return false;
    }

    // --- Hupe: ein kurzer Ton, gebaut mit der Web-Audio-Technik des Browsers ---
    let tonMaschine = null;
    function hupen(hoehe) {
      try {
        tonMaschine ??= new AudioContext();
        const jetzt = tonMaschine.currentTime;
        const lautstaerke = tonMaschine.createGain();
        lautstaerke.gain.setValueAtTime(0.0001, jetzt);
        lautstaerke.gain.exponentialRampToValueAtTime(0.15, jetzt + 0.02);
        lautstaerke.gain.exponentialRampToValueAtTime(0.0001, jetzt + 0.4);
        lautstaerke.connect(tonMaschine.destination);
        for (const faktor of [1, 1.26]) { // zwei Töne zusammen klingen wie eine Hupe
          const ton = tonMaschine.createOscillator();
          ton.type = 'square';
          ton.frequency.value = hoehe * faktor;
          ton.connect(lautstaerke);
          ton.start(jetzt);
          ton.stop(jetzt + 0.42);
        }
      } catch (e) { /* kein Ton möglich – macht nichts */ }
    }

    let aktuellesFahrzeug = null;   // in welchem Fahrzeug der Affe gerade sitzt (null = zu Fuß)
    let eGedrueckt = false;
    const fahrInfo = document.getElementById('fahrinfo');

    // Welches Fahrzeug ist nah genug zum Einsteigen?
    function naechstesFahrzeug(p) {
      let bestes = null, besterAbstand = Infinity;
      for (const f of fahrzeuge) {
        const abstand = Math.hypot(p.x - f.x, p.z - f.z) - f.laenge / 2;
        if (abstand < 1.3 && abstand < besterAbstand) { bestes = f; besterAbstand = abstand; }
      }
      return bestes;
    }

    function einsteigen(f) {
      aktuellesFahrzeug = f;
      f.tempo = 0;
      fallTempo = 0;
      hupen(f.hupe);
      zeigeMeldung(`${f.emoji} ${f.name}!`, 1.2);
    }

    function aussteigen() {
      const f = aktuellesFahrzeug;
      const s = Math.sin(f.richtung), c = Math.cos(f.richtung);
      // Plätze rund ums Fahrzeug ausprobieren: links, rechts, hinten, vorne – sonst aufs Dach
      const versuche = [
        [ f.breite / 2 + 0.8, 0], [-(f.breite / 2 + 0.8), 0],
        [0, -(f.laenge / 2 + 0.8)], [0, f.laenge / 2 + 0.8],
      ];
      aktuellesFahrzeug = null;
      for (const [seitlich, vorne] of versuche) {
        const x = f.x + s * vorne + c * seitlich, z = f.z + c * vorne - s * seitlich;
        if (!stoesstAn(x, 0.5, z) && bodenUnter(x, 0.5, z).hoehe === 0) {
          affe.position.set(x, 0.5, z);
          f.tempo = 0;
          return;
        }
      }
      affe.position.set(f.x, f.hoehe + 0.6, f.z); // kein Platz: oben drauf
      f.tempo = 0;
    }

    // Ein Bild lang fahren
    function fahren(f, dt) {
      const gas = (tasten.KeyW ? 1 : 0) - (tasten.KeyS ? 1 : 0);
      const lenkRichtung = (tasten.KeyA ? 1 : 0) - (tasten.KeyD ? 1 : 0); // A = links, D = rechts

      // Gas geben, bremsen, rückwärts fahren
      if (gas > 0) f.tempo += (f.tempo < 0 ? 25 : f.beschl) * dt;
      else if (gas < 0) f.tempo -= (f.tempo > 0 ? 25 : f.beschl * 0.6) * dt;
      else f.tempo -= Math.sign(f.tempo) * Math.min(Math.abs(f.tempo), 6 * dt); // ausrollen
      f.tempo = THREE.MathUtils.clamp(f.tempo, -f.maxTempo * 0.35, f.maxTempo);

      // Lenken geht nur, wenn das Fahrzeug rollt (rückwärts lenkt es andersherum, wie echt)
      f.lenkung += (lenkRichtung - f.lenkung) * Math.min(1, 8 * dt);
      const neueRichtung = f.richtung + f.lenkung * f.lenk * dt * THREE.MathUtils.clamp(f.tempo / 5, -1, 1);
      const nx = f.x + Math.sin(neueRichtung) * f.tempo * dt;
      const nz = f.z + Math.cos(neueRichtung) * f.tempo * dt;
      if (fahrzeugStoesst(f, nx, nz, neueRichtung)) {
        if (Math.abs(f.tempo) > 6) zeigeMeldung('💥 Bumm!', 0.8);
        f.tempo *= -0.3; // abprallen
      } else {
        f.x = nx; f.z = nz; f.richtung = neueRichtung;
      }
      fahrzeugZeigen(f);

      // Räder rollen und vorne lenken
      for (const r of f.raeder) {
        r.drehHalter.rotation.x += (f.tempo * dt) / r.r;
        if (r.vorne) r.lenkHalter.rotation.y = f.lenkung * 0.45;
      }
      // Motorrad legt sich in die Kurve
      if (f.typ === 'motorrad') {
        f.karosserie.rotation.z = -f.lenkung * THREE.MathUtils.clamp(f.tempo / f.maxTempo, 0, 1) * 0.45;
      }
      // Monstertruck wippt ein bisschen
      if (f.typ === 'monster') f.karosserie.position.y = Math.sin(spielZeit * 12) * 0.03 * Math.min(1, Math.abs(f.tempo) / 4);

      // Affe sitzt auf dem Sitz
      const [sx, sy, sz] = f.sitz;
      const s = Math.sin(f.richtung), c = Math.cos(f.richtung);
      affe.position.set(f.x + s * sz + c * sx, sy + f.karosserie.position.y, f.z + c * sz - s * sx);
      affe.rotation.y = f.richtung;
      affe.rotation.z = f.karosserie.rotation.z; // mit dem Motorrad mitneigen
      blickRichtung = f.richtung;
    }

    // --- Spiel-Schleife: läuft ca. 60 Mal pro Sekunde ---
    const uhr = new THREE.Clock();
    function spielSchleife() {
      const dt = Math.min(uhr.getDelta(), 0.05); // Zeit seit dem letzten Bild
      spielZeit += dt;

      // Kamera drehen mit den Pfeiltasten
      if (tasten.ArrowLeft)  kameraWinkel += DREH_TEMPO * dt; // Blick nach links drehen
      if (tasten.ArrowRight) kameraWinkel -= DREH_TEMPO * dt; // Blick nach rechts drehen
      if (tasten.ArrowUp)    kameraNeigung -= DREH_TEMPO * dt; // flacher schauen (Blick nach oben)
      if (tasten.ArrowDown)  kameraNeigung += DREH_TEMPO * dt; // mehr von oben schauen (Blick nach unten)
      kameraNeigung = THREE.MathUtils.clamp(kameraNeigung, 0.1, 1.4); // nicht unter den Boden, nicht ganz senkrecht

      const p = affe.position;
      plattformenBewegen(spielZeit); // fahrende Plattformen der Obby

      // E-Taste: einsteigen oder aussteigen
      if (eGedrueckt) {
        eGedrueckt = false;
        if (aktuellesFahrzeug) aussteigen();
        else { const f = naechstesFahrzeug(p); if (f) einsteigen(f); }
      }

      let dx = 0, dz = 0, amBoden = true, unter = { block: null };

      if (aktuellesFahrzeug) {
        // ===== FAHREN =====
        const f = aktuellesFahrzeug;
        if (sprungGedrueckt) { hupen(f.hupe); sprungGedrueckt = false; } // Leertaste = hupen
        fahren(f, dt);
        // Kamera dreht sich langsam hinter das Fahrzeug, sobald es fährt
        if (Math.abs(f.tempo) > 1 && !tasten.ArrowLeft && !tasten.ArrowRight) {
          let unterschied = (f.richtung + Math.PI) - kameraWinkel;
          unterschied = Math.atan2(Math.sin(unterschied), Math.cos(unterschied));
          kameraWinkel += unterschied * Math.min(1, 2.5 * dt);
        }
        kameraAbstand += ((f.typ === 'monster' ? 14 : 12) - kameraAbstand) * Math.min(1, 3 * dt);
        // Arme nach vorne ans Lenkrad, Beine nach vorne (sitzen)
        armLinks.rotation.set(-1.2, 0, -0.2); armRechts.rotation.set(-1.2, 0, 0.2);
        beinLinks.rotation.x = -1.4; beinRechts.rotation.x = -1.4;
        kopf.rotation.z = Math.sin(spielZeit * 3) * 0.05;
        figur.position.y = 0;
        const kmh = Math.round(Math.abs(f.tempo) * 3.6);
        fahrInfo.innerHTML = `<b>${f.emoji} ${f.name} · ${kmh} km/h</b>` +
          `<small>W Gas · S Bremse/Rückwärts · A/D lenken · Leertaste hupen · E aussteigen</small>`;
        fahrInfo.classList.add('offen');
      } else {
        // ===== LAUFEN =====
        affe.rotation.z = 0;
        kameraAbstand += (KAMERA_ABSTAND - kameraAbstand) * Math.min(1, 3 * dt);

        // Fahrende Plattformen nehmen den Affen mit, wenn er darauf steht
        if (stehtAufLetztes?.bewegung) {
          if (!stoesstAn(p.x + stehtAufLetztes.dx, p.y, p.z)) p.x += stehtAufLetztes.dx;
          if (!stoesstAn(p.x, p.y, p.z + stehtAufLetztes.dz)) p.z += stehtAufLetztes.dz;
        }

        // Bewegen mit W A S D – immer so, wie die Kamera gerade schaut
        const vor   = (tasten.KeyW ? 1 : 0) - (tasten.KeyS ? 1 : 0); // W = nach vorne, S = nach hinten
        const seite = (tasten.KeyD ? 1 : 0) - (tasten.KeyA ? 1 : 0); // D = nach rechts, A = nach links
        const sin = Math.sin(kameraWinkel), cos = Math.cos(kameraWinkel);
        dx = (-sin * vor + cos * seite) * TEMPO * dt;
        dz = (-cos * vor - sin * seite) * TEMPO * dt;

        // Nur bewegen, wenn dort kein Hindernis im Weg ist
        if (!stoesstAn(p.x + dx, p.y, p.z)) p.x += dx;
        if (!stoesstAn(p.x, p.y, p.z + dz)) p.z += dz;

        // Wo ist unter dem Affen fester Boden? (Gras, Block, Fahrzeug – oder Abgrund)
        unter = bodenUnter(p.x, p.y, p.z);
        const standHoehe = unter.hoehe + 0.5;

        // Springen: am Boden immer, in der Luft noch einmal (Doppelsprung)
        amBoden = p.y <= standHoehe + 0.001 && fallTempo <= 0;
        if (amBoden) sprungZaehler = 0; // gelandet: Sprünge wieder auffüllen
        if (sprungGedrueckt) {
          if (amBoden) {
            fallTempo = SPRUNGKRAFT; sprungZaehler = 1;           // erster Sprung
          } else if (sprungZaehler < MAX_SPRUENGE) {
            fallTempo = SPRUNGKRAFT; sprungZaehler = MAX_SPRUENGE; // zweiter Sprung in der Luft
          }
          sprungGedrueckt = false;
        }

        // Schwerkraft zieht ihn wieder herunter, bis er auf etwas landet
        fallTempo -= SCHWERKRAFT * dt;
        p.y += fallTempo * dt;
        if (p.y < standHoehe) { p.y = standHoehe; fallTempo = 0; }

        // Affe dreht sich in die Laufrichtung (sanft, nicht ruckartig)
        const laeuft = dx !== 0 || dz !== 0;
        if (laeuft) {
          const ziel = Math.atan2(dx, dz);
          let unterschied = ziel - blickRichtung;
          unterschied = Math.atan2(Math.sin(unterschied), Math.cos(unterschied)); // kürzester Weg herum
          blickRichtung += unterschied * Math.min(1, 12 * dt);
        }
        affe.rotation.y = blickRichtung;

        // Lustiges Wackeln: beim Laufen schwingen Arme und Beine, der Kopf wackelt
        laufZeit += dt * (laeuft ? 14 : 3);
        const schwung = laeuft ? 0.8 : 0.1;
        armLinks.rotation.x  =  Math.sin(laufZeit) * schwung;
        armRechts.rotation.x = -Math.sin(laufZeit) * schwung;
        armLinks.rotation.y = 0; armRechts.rotation.y = 0;
        beinLinks.rotation.x  = -Math.sin(laufZeit) * schwung * 0.7;
        beinRechts.rotation.x =  Math.sin(laufZeit) * schwung * 0.7;
        kopf.rotation.z = Math.sin(laufZeit * 0.5) * (laeuft ? 0.15 : 0.08);
        figur.position.y = amBoden && laeuft ? Math.abs(Math.sin(laufZeit)) * 0.06 : 0; // hüpft beim Laufen
        // In der Luft: Arme hoch wie "Juhuu!"
        if (!amBoden) {
          armLinks.rotation.z = -2.4; armRechts.rotation.z = 2.4;
        } else {
          armLinks.rotation.z = -0.35; armRechts.rotation.z = 0.35;
        }

        // Hinweis, wenn ein Fahrzeug in der Nähe ist
        const nah = naechstesFahrzeug(p);
        if (nah) {
          fahrInfo.innerHTML = `<b>Drücke E zum Einsteigen: ${nah.emoji} ${nah.name}</b>`;
          fahrInfo.classList.add('offen');
        } else {
          fahrInfo.classList.remove('offen');
        }
      }

      // --- Obby-Regeln ---
      if (p.y < -15) neuStart('Runtergefallen! 😵');   // in den Abgrund gefallen
      if (inLava(p.x, p.y, p.z)) neuStart('Lava! 🔥');  // Lava berührt
      const stehtAuf = amBoden ? unter.block : null;
      stehtAufLetztes = stehtAuf; // fürs nächste Bild merken (fahrende Plattformen)
      if (stehtAuf?.art === 'checkpoint' && stehtAuf !== letzterCheckpoint) {
        letzterCheckpoint = stehtAuf;
        startPunkt.set(stehtAuf.x, stehtAuf.oben + 0.5, stehtAuf.z); // ab jetzt startest du hier
        zeigeMeldung('Checkpoint! ✅');
      }
      if (stehtAuf?.art === 'ziel' && !imZiel) {
        imZiel = true;
        punkte += 100;
        punkteZeigen();
        zeigeMeldung('🏆 Obby geschafft! +100 Punkte', 3);
        zurueckZumStartUm = spielZeit + 3; // in 3 Sekunden geht's zurück zum Start
      }
      // Nach dem Ziel: zurück auf die Wiese, alles wieder von vorne
      if (imZiel && spielZeit >= zurueckZumStartUm) {
        imZiel = false;
        letzterCheckpoint = null;
        startPunkt.set(0, 0.5, 0);   // Startpunkt wieder auf die Wiese
        neuStart('Zurück zum Start! 🏁');
      }
      if (spielZeit > meldungBis) meldung.style.opacity = 0;

      // Die Sonne folgt dem Affen, damit es überall Schatten gibt
      sonne.position.set(p.x + 10, p.y + 20, p.z + 10);
      sonne.target.position.copy(p);

      // Umkleidekabine: Menü zeigen, solange der Affe (zu Fuß) drin steht
      kabinenMenue.classList.toggle('offen', !aktuellesFahrzeug && inKabine(p));
      if (regenbogen) fell.color.setHSL((spielZeit * 0.2) % 1, 0.8, 0.45);

      // Münzen drehen sich, werden eingesammelt und kommen nach 7 Sekunden wieder
      const sammelAbstand = aktuellesFahrzeug ? aktuellesFahrzeug.laenge / 2 + 0.4 : 1.1;
      for (const muenze of muenzen) {
        if (!muenze.visible) {
          // Unsichtbare Münze: ist ihre Wartezeit vorbei?
          if (spielZeit >= muenze.userData.kommtWiederUm) muenze.visible = true;
          continue;
        }
        muenze.rotation.z += 3 * dt; // drehen
        const abstand = aktuellesFahrzeug
          ? Math.hypot(muenze.position.x - aktuellesFahrzeug.x, muenze.position.z - aktuellesFahrzeug.z) + (muenze.position.y > 3 ? 99 : 0)
          : muenze.position.distanceTo(p);
        if (abstand < sammelAbstand) {
          muenze.visible = false;  // Münze verschwindet (nur versteckt)
          muenze.userData.kommtWiederUm = spielZeit + WIEDERKOMMEN_NACH;
          punkte += PUNKTE_PRO_MUENZE;
          punkteZeigen();
        }
      }

      // Kamera kreist um den Affen: Winkel = rundherum, Neigung = wie hoch von oben
      const flach = Math.cos(kameraNeigung) * kameraAbstand;
      kamera.position.set(
        p.x + Math.sin(kameraWinkel) * flach,
        p.y + Math.sin(kameraNeigung) * kameraAbstand,
        p.z + Math.cos(kameraWinkel) * flach
      );
      kamera.lookAt(p);

      renderer.render(szene, kamera);
    }
    renderer.setAnimationLoop(spielSchleife); // ruft spielSchleife bei jedem Bild auf

    // Wenn das Fenster größer/kleiner wird, Bild anpassen
    addEventListener('resize', () => {
      kamera.aspect = innerWidth / innerHeight;
      kamera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
