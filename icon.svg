    <text x="256" y="494" text-anchor="middle" font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="54" letter-spacing="4" fill="#fff" stroke="#1a0b3d" stroke-width="10" paint-order="stroke">AFFENWELT</text>
